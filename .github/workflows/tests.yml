name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lead-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
