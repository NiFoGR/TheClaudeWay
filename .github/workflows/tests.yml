name: Tests

on:
  push:
    paths-ignore: ["legacy/**"]
  pull_request:
    paths-ignore: ["legacy/**"]

permissions:
  contents: read

jobs:
  lead-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  control-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in control-room/public/js/*.js control-room/functions/_lib/*.js control-room/functions/_lib/mail/*.js mail-relay/src/*.js; do if [ -e "$f" ]; then node --check "$f"; fi; done
      - run: node --test control-room/tests/*.test.mjs mail-relay/tests/*.test.mjs
