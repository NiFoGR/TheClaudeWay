name: Scrape leads

# Runs in GitHub's cloud, so your PC can be off. Normally started by the Control Room's "Find leads" button;
# can also be started by hand: Actions → Scrape leads → Run workflow.
on:
  workflow_dispatch:
    inputs:
      trade:
        description: 'Trade, e.g. "roofer"'
        required: true
      town:
        description: 'UK town, e.g. "Leeds"'
        required: true
      max:
        description: "How many businesses to find (10-300)"
        required: false
        default: "60"
      job_id:
        description: "Control Room run id (filled in automatically)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lead-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lead-manager/requirements.txt
      - run: pip install -r requirements.txt
      - name: Find and qualify leads
        id: scrape
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRADE: ${{ inputs.trade }}
          TOWN: ${{ inputs.town }}
          MAX: ${{ inputs.max }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -o pipefail
          python -m aetos_leads --trade "$TRADE" --town "$TOWN" --max "$MAX" --job-id "$JOB_ID" --out output | tee output-summary.txt
      # One Claude run per Find-leads press, only if some leads need it (docs/lead-research-routine.md).
      # Uses the owner's Claude subscription via a Routine's API trigger. Never fails the scrape.
      - name: Hand the hard cases to Claude
        if: success() && steps.scrape.outputs.for_claude != '0' && steps.scrape.outputs.for_claude != ''
        continue-on-error: true
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL || vars.CLAUDE_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN || vars.CLAUDE_ROUTINE_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          N: ${{ steps.scrape.outputs.for_claude }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "Claude research not set up yet (add CLAUDE_ROUTINE_URL and CLAUDE_ROUTINE_TOKEN secrets). Skipping."
            exit 0
          fi
          JOB="${JOB_ID//[^a-zA-Z0-9-]/}"
          curl -fsS -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{\"text\": \"job_id=${JOB} leads=${N}\"}"
      - name: Tell the Control Room the run failed
        if: failure() && inputs.job_id != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python -m aetos_leads --fail-job "$JOB_ID" "The scraper crashed. Open the run on GitHub (Actions tab) for details."
      - name: Show summary on the run page
        if: success()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat output-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: leads-${{ inputs.trade }}-${{ inputs.town }}
          path: lead-manager/output/
          retention-days: 30
