<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aetos Control Room</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <form class="card" method="post" action="/login">
      <div class="brand"><div class="brand-mark">A</div><div><b>Aetos</b><span>Control Room</span></div></div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <p class="error" id="wrong" hidden>Wrong password.</p>
      <p><button class="btn" type="submit" style="width:100%">Log in</button></p>
    </form>
  </main>
  <script>if (location.search.includes("wrong")) document.getElementById("wrong").hidden = false;</script>
</body>
</html>
